<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post Card</title>
  <link rel="stylesheet" href="post-card.css">
</head>
<body>

  <div class="blog-post-card">
    <img
      class="post-img"
      src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
      alt="A beautiful landscape with mountains and a lake"
    >

    <div class="post-content">
      <h2 class="post-title">My First Blog Post</h2>

      <p class="post-excerpt">
        Discover some useful tips for learning web development and building amazing projects.
      </p>

      <a class="read-more" href="#">Read More</a>
    </div>
  </div>

</body>
</html>
